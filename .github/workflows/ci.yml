name: Portable offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-28
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, official ref checked 2026-10-28
        with:
          python-version: '3.11'
      - name: Standard-library tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax and UI state tests
        shell: bash
        run: |
          node --version
          find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          node --test tests/test_ui*.mjs
      - name: Build candidate source and client packages
        shell: bash
        run: |
          mkdir -p dist
          python -B tools/release.py build --package source --version 0.1.0-alpha.1 --output dist/agilex-source-0.1.0-alpha.1.zip > dist/source-build-receipt.json
          python -B tools/release.py build --package client --version 0.1.0-alpha.1 --output dist/agilex-client-0.1.0-alpha.1.zip > dist/client-build-receipt.json
      - name: Upload candidate client package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official ref checked 2026-10-28
        with:
          name: agilex-client-candidate-0.1.0-alpha.1-${{ github.sha }}
          path: |
            dist/agilex-client-0.1.0-alpha.1.zip
            dist/client-build-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload candidate source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official ref checked 2026-10-28
        with:
          name: agilex-source-candidate-0.1.0-alpha.1-${{ github.sha }}
          path: |
            dist/agilex-source-0.1.0-alpha.1.zip
            dist/source-build-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
